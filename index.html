<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevk Verisi Giriş İstasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --primary: #6c63ff;
            --primary-hover: #5a52d5;
            --secondary: #00d4aa;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #e8e8ed;
            --text-secondary: #8b8d98;
            --highlight: rgba(245, 158, 11, 0.2);
            --highlight-border: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: rgba(26, 29, 39, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .privacy-note {
            font-size: 0.8rem;
            color: var(--success);
            background: rgba(34, 197, 94, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Progress Bar */
        .progress-container {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
        }

        .progress-bar-bg {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Main Layout */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Panel (PDF) */
        .left-panel {
            flex: 6;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--surface);
            position: relative;
        }

        .upload-panels-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .pdf-upload-zone {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 17, 23, 0.9);
            z-index: 5;
            transition: all 0.3s ease;
        }
        
        .pdf-upload-zone.hidden {
            display: none;
        }

        .pdf-upload-zone.dragover {
            background: rgba(108, 99, 255, 0.1);
            border: 2px dashed var(--primary);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .pdf-viewer-container {
            flex: 1;
            overflow: auto;
            position: relative;
            padding: 1rem;
        }

        .extracted-text-panel {
            height: 30%;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .extracted-text-content {
            flex: 1;
            padding: 1rem;
            overflow: auto;
            font-family: monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #d1d5db;
        }

        /* Right Panel (Form) */
        .right-panel {
            flex: 4;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        .form-actions {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            background: var(--surface);
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
        }
        
        .btn-warning {
            background: var(--warning);
            color: #000;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .form-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        /* Accordion */
        .accordion-item {
            margin-bottom: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--surface);
            overflow: hidden;
        }

        .accordion-header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: rgba(255,255,255,0.02);
        }

        .accordion-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .accordion-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
        }

        .accordion-content {
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: rgba(0,0,0,0.15);
        }

        .accordion-item.active .accordion-content {
            padding: 1rem;
            max-height: 2000px; /* Arbitrary large number for transition */
        }

        .accordion-item.active .accordion-header {
            border-bottom: 1px solid var(--border);
        }

        /* Form Fields */
        .field-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.6rem 0.75rem;
            border-radius: 0.375rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.2);
        }

        input.auto-filled, select.auto-filled {
            background: var(--highlight);
            border-color: var(--highlight-border);
            animation: pulse-border 2s;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* ===== Vision / Belge Yükleme Paneli ===== */
        
        /* Yan yana düzen wrapper */
        .vision-layout-wrapper {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 1.5rem;
            align-items: start;
        }
        
        .vision-panel-column {
            position: sticky;
            top: 1rem;
        }
        
        .form-grid-column {
            min-width: 0; /* grid overflow fix */
        }
        
        .vision-panel {
            margin-bottom: 0.75rem;
            border: 1px solid var(--secondary);
            border-radius: 0.5rem;
            background: linear-gradient(180deg, rgba(0,212,170,0.06), var(--surface));
            overflow: hidden;
        }

        .vision-panel-header {
            padding: 0.85rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--secondary);
            border-bottom: 1px solid var(--border);
        }

        .vision-panel-body {
            padding: 1rem;
        }

        .vision-drop {
            border: 2px dashed var(--border);
            border-radius: 0.5rem;
            padding: 1.25rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .vision-drop:hover, .vision-drop.dragover {
            border-color: var(--secondary);
            background: rgba(0,212,170,0.08);
            color: var(--text-primary);
        }

        .vision-drop .vision-drop-icon {
            font-size: 1.75rem;
            display: block;
            margin-bottom: 0.4rem;
        }

        .vision-thumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.85rem;
        }

        .vision-thumb {
            position: relative;
            width: 84px;
            height: 84px;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            overflow: hidden;
            background: rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 0.25rem;
        }

        .vision-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vision-thumb .pdf-badge {
            font-size: 1.5rem;
        }

        .vision-thumb .thumb-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vision-thumb .thumb-remove:hover {
            background: var(--danger);
        }

        .vision-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }

        .vision-actions-top {
            margin-bottom: 0.85rem;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--surface);
            padding-bottom: 0.25rem;
        }

        .btn-vision {
            background: var(--secondary);
            color: #06231d;
            font-weight: 600;
        }

        .btn-vision:hover { filter: brightness(1.08); }

        .btn-vision:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .vision-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .vision-spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #06231d;
            border-radius: 50%;
            animation: vision-spin 0.7s linear infinite;
            display: inline-block;
        }

        @keyframes vision-spin { to { transform: rotate(360deg); } }

        .vision-apikey-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.85rem;
            flex-wrap: wrap;
        }

        .vision-apikey-row input {
            flex: 1;
            min-width: 180px;
        }

        .vision-hint {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
            line-height: 1.4;
        }

        .vision-hint a { color: var(--secondary); }

        /* Bottom Table Panel */
        .bottom-panel {
            height: 250px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .table-container {
            flex: 1;
            overflow: auto;
            padding: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 2;
        }
        
        tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: var(--surface);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 0.25rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            transform: translateX(100%);
            animation: slideIn 0.3s forwards;
        }
        
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: var(--warning); }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOut {
            to { opacity: 0; transform: translateX(100%); }
        }
        
        /* Grid layout for form fields */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .full-width {
            grid-column: 1 / -1;
        }

        /* ===== MOBILE TAB NAVIGATION ===== */
        .mobile-tabs {
            display: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .mobile-tabs button {
            flex: 1;
            min-width: 0;
            padding: 0.75rem 1rem;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .mobile-tabs button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(108, 99, 255, 0.08);
        }

        /* ===== RESPONSIVE: TABLET (≤ 900px) ===== */
        @media (max-width: 900px) {
            header {
                padding: 0.75rem 1rem;
            }
            .header-title h1 {
                font-size: 1.05rem;
            }
            .privacy-note {
                font-size: 0.7rem;
                padding: 0.2rem 0.5rem;
            }
            .progress-container {
                width: 160px;
            }
            .main-content {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                height: 45%;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .right-panel {
                flex: 1;
                min-height: 0;
            }
            .bottom-panel {
                height: auto;
                max-height: 250px;
            }
        }

        /* ===== RESPONSIVE: MOBILE (≤ 768px) ===== */
        @media (max-width: 768px) {
            /* Yan yana düzen mobilde alt alta olsun */
            .vision-layout-wrapper {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .vision-panel-column {
                position: static;
            }
            
            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
                min-height: 100dvh;
            }
            header {
                padding: 0.65rem 0.75rem;
                flex-wrap: wrap;
                position: sticky;
                top: 0;
                z-index: 20;
            }
            .header-title {
                width: 100%;
                justify-content: space-between;
            }
            .header-title h1 {
                font-size: 0.95rem;
            }
            .privacy-note {
                font-size: 0.65rem;
            }
            .header-actions {
                width: 100%;
                justify-content: space-between;
                gap: 0.5rem;
            }
            .header-actions .btn {
                font-size: 0.75rem;
                padding: 0.4rem 0.6rem;
            }
            .header-actions .btn svg {
                width: 14px;
                height: 14px;
            }
            .progress-container {
                width: 120px;
            }
            .progress-text {
                font-size: 0.65rem;
            }
            /* Mobile Tab Navigation */
            .mobile-tabs {
                display: flex;
                position: sticky;
                top: auto;
                z-index: 15;
            }
            .main-content {
                flex-direction: column;
                overflow: visible;
                flex: none;
            }
            /* Panel switching via tabs */
            .left-panel {
                flex: none;
                height: auto;
                min-height: 300px;
                max-height: 55vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .left-panel.panel-hidden {
                display: none;
            }
            .right-panel {
                flex: none;
                height: auto;
                min-height: 400px;
            }
            .right-panel.panel-hidden {
                display: none;
            }
            .form-actions {
                padding: 0.6rem 0.75rem;
                gap: 0.5rem;
                flex-wrap: wrap;
                position: sticky;
                top: 0;
                z-index: 5;
            }
            .form-actions .btn {
                font-size: 0.75rem;
                padding: 0.45rem 0.65rem;
            }
            .form-container {
                padding: 0.75rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .accordion-header {
                padding: 0.75rem;
            }
            .accordion-title {
                font-size: 0.85rem;
            }
            .accordion-status {
                font-size: 0.65rem;
            }
            .accordion-item.active .accordion-content {
                padding: 0.75rem;
            }
            .field-group {
                margin-bottom: 0.75rem;
            }
            label {
                font-size: 0.78rem;
            }
            input, select {
                padding: 0.7rem 0.75rem;
                font-size: 0.85rem;
                /* Prevent zoom on iOS */
                font-size: max(0.85rem, 16px);
            }
            /* Bottom panel */
            .bottom-panel {
                height: auto;
                min-height: 200px;
            }
            .bottom-panel.panel-hidden {
                display: none;
            }
            .table-container {
                padding: 0.5rem;
            }
            table {
                font-size: 0.75rem;
            }
            th, td {
                padding: 0.5rem;
            }
            /* PDF upload zone */
            .pdf-upload-zone h2 {
                font-size: 1.1rem;
            }
            .upload-icon {
                font-size: 3rem;
            }
            .extracted-text-panel {
                height: 40%;
                min-height: 120px;
            }
            .extracted-text-content {
                font-size: 0.75rem;
                padding: 0.6rem;
            }
            /* Toast mobile */
            .toast-container {
                bottom: 10px;
                right: 10px;
                left: 10px;
            }
            .toast {
                font-size: 0.8rem;
                padding: 0.75rem;
            }
        }

        /* ===== RESPONSIVE: SMALL MOBILE (≤ 480px) ===== */
        @media (max-width: 480px) {
            header {
                padding: 0.5rem 0.6rem;
            }
            .header-title h1 {
                font-size: 0.85rem;
            }
            .privacy-note {
                font-size: 0.6rem;
                padding: 0.15rem 0.4rem;
            }
            .header-actions .btn span {
                display: none;
            }
            .progress-container {
                width: 100px;
            }
            .mobile-tabs button {
                font-size: 0.7rem;
                padding: 0.6rem 0.5rem;
            }
            .left-panel {
                min-height: 250px;
                max-height: 50vh;
            }
            .form-actions {
                padding: 0.5rem;
            }
            .form-container {
                padding: 0.5rem;
            }
            .accordion-header {
                padding: 0.6rem;
            }
            .accordion-title {
                font-size: 0.8rem;
            }
            input, select {
                padding: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Sevk Verisi Giriş İstasyonu</h1>
            <span class="privacy-note">🔒 Tamamen yerel — hiçbir veri dışarı gönderilmez</span>
        </div>
        <div class="header-actions">
            <div class="progress-container">
                <div class="progress-text"><span id="filled-count">0</span> / 88 alan dolduruldu</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="exportToExcel()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>Dışa Aktar (Ctrl+E)</span>
            </button>
        </div>
    </header>

    <div class="mobile-tabs" id="mobile-tabs">
        <button class="active" data-panel="pdf" onclick="switchMobilePanel('pdf')">📄 Belge</button>
        <button data-panel="form" onclick="switchMobilePanel('form')">📋 Form</button>
        <button data-panel="records" onclick="switchMobilePanel('records')">📊 Kayıtlar</button>
    </div>

    <div class="main-content">
        <div class="left-panel">
            <div class="upload-panels-container" id="upload-panels-container">
                <!-- Sevk Öncesi ve Sevk Sonrası yükleme panelleri JS ile eklenir -->
            </div>
        </div>

        <div class="right-panel">
            <div class="form-actions">

        // ===== Mobile Panel Switching =====
        function switchMobilePanel(panel) {
            const leftPanel = document.querySelector('.left-panel');
            const rightPanel = document.querySelector('.right-panel');
            const bottomPanel = document.querySelector('.bottom-panel');
            const tabs = document.querySelectorAll('.mobile-tabs button');

            // Update tab active state
            tabs.forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-panel') === panel);
            });

            // Check if we're in mobile view
            const isMobile = window.innerWidth <= 768;
            if (!isMobile) return;

            // Show/hide panels
            if (panel === 'pdf') {
                leftPanel.classList.remove('panel-hidden');
                rightPanel.classList.add('panel-hidden');
                bottomPanel.classList.add('panel-hidden');
            } else if (panel === 'form') {
                leftPanel.classList.add('panel-hidden');
                rightPanel.classList.remove('panel-hidden');
                bottomPanel.classList.add('panel-hidden');
            } else if (panel === 'records') {
                leftPanel.classList.add('panel-hidden');
                rightPanel.classList.add('panel-hidden');
                bottomPanel.classList.remove('panel-hidden');
            }
        }

        // Reset panel visibility on resize
        window.addEventListener('resize', function() {
            const leftPanel = document.querySelector('.left-panel');
            const rightPanel = document.querySelector('.right-panel');
            const bottomPanel = document.querySelector('.bottom-panel');
            
            if (window.innerWidth > 768) {
                // Desktop: show all panels
                leftPanel.classList.remove('panel-hidden');
                rightPanel.classList.remove('panel-hidden');
                bottomPanel.classList.remove('panel-hidden');
            } else {
                // Mobile: apply current tab state
                const activeTab = document.querySelector('.mobile-tabs button.active');
                if (activeTab) {
                    switchMobilePanel(activeTab.getAttribute('data-panel'));
                }
            }
        });

        // Initialize mobile state on load
        document.addEventListener('DOMContentLoaded', function() {
            if (window.innerWidth <= 768) {
                switchMobilePanel('pdf');
            }
        });

        function initForm() {
            const container = document.getElementById('form-container');

                const catFields = FIELDS.filter(f => f.cat === cat.id);
                if(catFields.length === 0) return;

                const accordion = document.createElement('div');
                accordion.className = 'accordion-item';
                if(cat.id === 1) accordion.classList.add('active'); // Open first by default

                accordion.innerHTML = `
                    <div class="accordion-header" onclick="this.parentElement.classList.toggle('active')">
                        <div class="accordion-title">${cat.id}. ${cat.name}</div>
                        <div class="accordion-status"><span class="cat-filled">0</span> / ${catFields.length} dolu</div>
                    </div>
                    <div class="accordion-content">
                        <div class="form-grid"></div>
                    </div>

                const grid = accordion.querySelector('.form-grid');

                catFields.forEach(field => {
                    const group = document.createElement('div');
                    group.className = 'field-group';
                    if (field.full) group.classList.add('full-width');

                    let inputHtml = '';
                    if (field.type === 'select') {
                        let optsHtml = '<option value="">Seçiniz...</option>';
                        field.opts.forEach(opt => {
                            optsHtml += `<option value="${opt.v}">${opt.t}</option>`;
                        });
                        inputHtml = `<select id="${field.id}" onchange="updateProgress()">${optsHtml}</select>`;
                    } else {
                        const stepAttr = field.step ? `step="${field.step}"` : '';
                        // Otomatik doldurma: Sevk Tarihi -> Gün Tipi, Sevk Saati -> Mesai Durumu
                        let extraHandler = 'updateProgress()';
                        if (field.id === 'f4') extraHandler = 'autoFillGunTipi(this.value); updateProgress()';
                        if (field.id === 'f5') extraHandler = 'autoFillMesai(this.value); updateProgress()';
                        inputHtml = `<input type="${field.type}" id="${field.id}" ${stepAttr} oninput="${extraHandler}" onchange="${extraHandler}" autocomplete="off">`;
                    }

                    group.innerHTML = `
                        <label for="${field.id}">${field.label}</label>
                        ${inputHtml}
                    `;
                    grid.appendChild(group);
                });

                container.appendChild(accordion);
            });

            // Sol panele Sevk Öncesi ve Sevk Sonrası yükleme panellerini ekle
            const uploadContainer = document.getElementById('upload-panels-container');
            if (uploadContainer) {
                uploadContainer.innerHTML = '';
                uploadContainer.appendChild(buildVisionPanel('pre'));
                uploadContainer.appendChild(buildVisionPanel('post'));
            }

            updateProgress();
            renderTable();
        }

        function updateProgress() {
            let filledCount = 0;
            CATEGORIES.forEach((cat, index) => {
                const catFields = FIELDS.filter(f => f.cat === cat.id);
                let catFilled = 0;
                
                catFields.forEach(field => {
                    const el = document.getElementById(field.id);
                    if(el && el.value.trim() !== '') {
                        filledCount++;
                        catFilled++;
                    }
                });

                const accordions = document.querySelectorAll('.accordion-item');
                if(accordions[index]) {
                    const statusSpan = accordions[index].querySelector('.cat-filled');
                    if(statusSpan) statusSpan.textContent = catFilled;
                }
            });

            document.getElementById('filled-count').textContent = filledCount;
            const percentage = (filledCount / FIELDS.length) * 100;
            document.getElementById('progress-bar').style.width = percentage + '%';
            
            if(percentage === 100) {
                document.getElementById('progress-bar').style.background = 'var(--success)';
            } else {
                document.getElementById('progress-bar').style.background = 'var(--primary)';
            }
        }

        function showToast(msg, type='success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = '✅';
            if(type==='error') icon = '❌';
            if(type==='warning') icon = '⚠️';
            
            toast.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', e => {
            if(e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveRecord();
            }
            if(e.ctrlKey && e.key === 'e') {
                e.preventDefault();
                exportToExcel();
            }
        });

        function copySelectedText() {
            const selection = window.getSelection().toString();
            if(selection) {
                navigator.clipboard.writeText(selection).then(() => {
                    showToast('Seçili metin kopyalandı.');
                });
            } else {
                showToast('Kopyalanacak metin seçilmedi.', 'warning');
            }
        }

        // Smart Parsing Engine
        function autoFillForm() {
            if(!parsedPdfText) {
                showToast('Önce bir PDF yüklemelisiniz.', 'warning');
                return;
            }

            const rawText = parsedPdfText;
            const text = rawText.replace(/\s+/g, ' ').trim();
            let filledCount = 0;

            function setVal(fieldId, value) {
                if (value === null || value === undefined || String(value).trim() === '') return;
                const el = document.getElementById(fieldId);
                if (!el) return;
                if (el.value && el.value.trim() !== '') return;
                let v = String(value).trim();
                // Tarih alanı (date input) için gg.aa.yyyy -> yyyy-mm-dd çevir
                if (el.type === 'date') v = displayToDate(v);
                el.value = v;
                el.classList.add('auto-filled');
                setTimeout(() => el.classList.remove('auto-filled'), 5000);
                filledCount++;
                // Sevk Tarihi/Saati okunduğunda gün tipi ve mesai durumunu otomatik doldur
                if (fieldId === 'f4') autoFillGunTipi(el.value);
                if (fieldId === 'f5') autoFillMesai(el.value);
            }

            // ===== 1. TC KİMLİK NO =====
            // Note: TC Kimlik No is 11 digits and NEVER starts with 0 (phone numbers start with 05xx)
            let tc = null;
            
            // Direct regex for TC Kimlik No label followed by 11-digit number starting with 1-9
            const tcMatch = text.match(/(?:TC\s*Kimlik\s*(?:No|Numaras[ıi])?|TCKN|T\.?C\.?)\s*[:\-]?\s*([1-9]\d{10})\b/i);
            if (tcMatch) {
                tc = tcMatch[1];
            } else {
                // Look for any 11-digit number starting with 1-9 (excluding 05xx phone numbers)
                const all11DigitNums = text.match(/\b([1-9]\d{10})\b/g);
                if (all11DigitNums && all11DigitNums.length > 0) {
                    // Pick the first one that is NOT a phone number (phone numbers often start with 0, but if missing leading zero check if 5xx)
                    const candidate = all11DigitNums.find(n => !n.startsWith('0') && !n.startsWith('50') && !n.startsWith('53') && !n.startsWith('54') && !n.startsWith('55'));
                    if (candidate) tc = candidate;
                    else tc = all11DigitNums[0];
                }
            }
            if (tc) setVal('f1', tc);

            // ===== 2. YAŞ =====
            let yas = null;
            const yasMatch = text.match(/(?:Yaş|yaş|Yashi|Y:)\s*[:\-]?\s*(\d{1,3})\b/i);
            if (yasMatch) {
                const yVal = parseInt(yasMatch[1]);
                if (yVal > 0 && yVal < 120) yas = String(yVal);
            }
            
            // Calculate age from Doğum Tarihi if age not directly found
            if (!yas) {
                const dtMatch = text.match(/(?:Doğum\s*Tarihi|D\.?\s*Tarihi|Dogum\s*Tarihi)\s*[:\-]?\s*(\d{2})[\.\/-](\d{2})[\.\/-](\d{4})/i);
                if (dtMatch) {
                    const d = parseInt(dtMatch[1]), m = parseInt(dtMatch[2]), y = parseInt(dtMatch[3]);
                    const birthDate = new Date(y, m - 1, d);
                    const now = new Date();
                    let calcAge = now.getFullYear() - birthDate.getFullYear();
                    if (now.getMonth() < birthDate.getMonth() || (now.getMonth() === birthDate.getMonth() && now.getDate() < birthDate.getDate())) {
                        calcAge--;
                    }
                    if (calcAge >= 0 && calcAge < 120) yas = String(calcAge);
                }
            }
            if (yas) setVal('f2', yas);

            // ===== 3. CİNSİYET =====
            const cinsiyetMatch = text.match(/(?:Cinsiyet|Cinsiyeti)\s*[:\-]?\s*(Erkek|Kadın|E|K)\b/i);
            if (cinsiyetMatch) {
                const val = cinsiyetMatch[1].toUpperCase();
                if (val === 'ERKEK' || val === 'E') setVal('f3', '1');
                else if (val === 'KADIN' || val === 'K') setVal('f3', '2');
            } else {
                if (/\b(?:Erkek|ERKEK|Bay)\b/.test(text)) setVal('f3', '1');
                else if (/\b(?:Kadın|KADIN|Bayan)\b/.test(text)) setVal('f3', '2');
            }

            // ===== 4. SEVK / BAŞVURU TARİHİ =====
            // Strictly match Sevk Tarihi, Başvuru Tarihi, Transfer Tarihi, Kabul Tarihi (exclude Doğum Tarihi!)
            let tarih = null;
            const sevkTarihiMatch = text.match(/(?:Sevk\s*Tarihi|Başvuru\s*Tarihi|Transfer\s*Tarihi|Kabul\s*Tarihi|Giriş\s*Tarihi)\s*[:\-]?\s*(\d{2}[\.\/-]\d{2}[\.\/-]\d{4})/i);
            if (sevkTarihiMatch) {
                tarih = sevkTarihiMatch[1];
            } else {
                // If not found with label, look for date that is NOT preceded by "Doğum"
                const dates = text.matchAll(/(\d{2})[\.\/-](\d{2})[\.\/-](\d{4})/g);
                for (const dMatch of dates) {
                    const matchIndex = dMatch.index;
                    const precedingText = text.substring(Math.max(0, matchIndex - 20), matchIndex);
                    if (!/Doğum|Dogum|D\.Tarihi/i.test(precedingText)) {
                        tarih = dMatch[0];
                        break;
                    }
                }
            }
            if (tarih) {
                tarih = tarih.replace(/[\/-]/g, '.');
                setVal('f4', tarih);
            }

            // ===== 5. SEVK SAATİ / KABUL SAATİ =====
            const sevkSaatiMatch = text.match(/(?:Sevk\s*Saati|Başvuru\s*Saati|Giriş\s*Saati|112\s*Saat)\s*[:\-]?\s*(\d{2}[:\.]\d{2})/i);
            if (sevkSaatiMatch) {
                setVal('f5', sevkSaatiMatch[1].replace('.', ':'));
            }
            const kabulSaatiMatch = text.match(/(?:Kabul\s*Saati|Teslim\s*Saati)\s*[:\-]?\s*(\d{2}[:\.]\d{2})/i);
            if (kabulSaatiMatch) {
                setVal('f6', kabulSaatiMatch[1].replace('.', ':'));
            }

            // ===== 6. SEVK TANISI (Yazıyla & ICD-10) =====
            // ICD-10 Code search (e.g., R07.4, I21.9, W13)
            const icdMatch = text.match(/(?:ICD|icd|Tanı\s*Kodu|ICD10)\s*[:\-]?\s*([A-Z]\d{2}(?:\.\d{1,2})?)/i) || text.match(/\b([A-Z]\d{2}\.\d{1,2})\b/);
            if (icdMatch) {
                setVal('f19', icdMatch[1]);
                setVal('f79', icdMatch[1]);
            }

            // Diagnosis free text
            const taniMatch = text.match(/(?:Sevk\s*Tan[ıi]s[ıi]|Ön\s*Tan[ıi]|Ana\s*Tan[ıi]|Tan[ıi]|Teşhis)\s*[:\-]?\s*([A-ZÇĞİÖŞÜa-zçğıöşü0-9\s\.\,\-\(\)\/]{3,60})/i);
            if (taniMatch) {
                // Clean up any trailing label keywords if pulled
                let cleanTani = taniMatch[1].split(/(?:ICD|Başvuru|Sevk|Doktor|Hekim|Tarih|Hasta)/i)[0].trim();
                if (cleanTani.length > 2) {
                    setVal('f18', cleanTani);
                    setVal('f78', cleanTani);
                }
            }

            // ===== 7. KAN BASINCI (TA - Sistolik / Diyastolik) =====
            const taPatterns = [
                /(?:TA|Tansiyon|Kan\s*Basıncı|Arter[iy]el)\s*[:\-]?\s*(\d{2,3})\s*[\/\\]\s*(\d{2,3})/i,
                /(?:Sistolik|SKB)\s*[:\-]?\s*(\d{2,3})\s*.*?(?:Diyastolik|DKB)\s*[:\-]?\s*(\d{2,3})/i,
                /(\d{2,3})\s*\/\s*(\d{2,3})\s*(?:mmHg|mm\s*Hg)/i,
            ];
            for (const p of taPatterns) {
                const m = text.match(p);
                if (m) {
                    const sys = parseInt(m[1]), dia = parseInt(m[2]);
                    if (sys >= 50 && sys <= 300 && dia >= 20 && dia <= 200) {
                        setVal('f35', String(sys));
                        setVal('f36', String(dia));
                        const map = Math.round((sys + 2 * dia) / 3);
                        setVal('f37', String(map));
                        break;
                    }
                }
            }

            // ===== 8. SpO2 =====
            const spo2Match = text.match(/(?:SpO2|SPO2|Spo2|Saturasyon|O2\s*Sat|SaO2)\s*[:\-]?\s*%?\s*(\d{2,3})\s*%?/i);
            if (spo2Match && parseInt(spo2Match[1]) >= 50 && parseInt(spo2Match[1]) <= 100) {
                setVal('f38', spo2Match[1]);
            }

            // ===== 9. NABIZ / KALP HIZI =====
            const nabizMatch = text.match(/(?:Nabız|Nab[ıi]z|Kalp\s*H[ıi]z[ıi]|KH|Pulse|HR)\s*[:\-]?\s*(\d{2,3})\s*(?:\/dk|\/min|dk|bpm)?/i);
            if (nabizMatch && parseInt(nabizMatch[1]) >= 20 && parseInt(nabizMatch[1]) <= 250) {
                setVal('f39', nabizMatch[1]);
            }

            // ===== 10. SOLUNUM SAYISI =====
            const ssMatch = text.match(/(?:Solunum\s*(?:Say[ıi]s[ıi])?|SS|RR|Resp)\s*[:\-]?\s*(\d{1,2})\s*(?:\/dk|\/min)?/i);
            if (ssMatch && parseInt(ssMatch[1]) >= 6 && parseInt(ssMatch[1]) <= 60) {
                setVal('f40', ssMatch[1]);
            }

            // ===== 11. VÜCUT ISISI (ATEŞ) =====
            const atesMatch = text.match(/(?:Ateş|Is[ıi]|Vücut\s*[Iı]s[ıi]s[ıi]|Temp|T°)\s*[:\-]?\s*(\d{2}[\.,]\d{1})\s*°?C?/i) || text.match(/(?:Ateş|Is[ıi])\s*[:\-]?\s*(\d{2})\s*°?C/i);
            if (atesMatch) {
                const temp = parseFloat(atesMatch[1].replace(',', '.'));
                if (temp >= 34 && temp <= 42) setVal('f41', atesMatch[1].replace(',', '.'));
            }

            // ===== 12. GKS =====
            const gksMatch = text.match(/(?:GKS|GCS|Glasgow)\s*[:\-]?\s*(\d{1,2})(?:\s*\/\s*15)?/i);
            if (gksMatch && parseInt(gksMatch[1]) >= 3 && parseInt(gksMatch[1]) <= 15) {
                setVal('f43', gksMatch[1]);
            }

            // ===== 13. AVPU =====
            if (/\b(?:Alert|Uyanık|Bilinç\s*açık)\b/i.test(text)) setVal('f42', '1');
            else if (/\b(?:Verbal|Sözel)\b/i.test(text)) setVal('f42', '2');
            else if (/\b(?:Pain|Ağrı)\b/i.test(text)) setVal('f42', '3');
            else if (/\b(?:Unresponsive|Yanıtsız|Bilinçsiz)\b/i.test(text)) setVal('f42', '4');

            // ===== 14. LAB VALUES =====
            const hbMatch = text.match(/(?:Hemoglobin|Hgb|Hb)\s*[:\-]?\s*(\d{1,2}[\.,]\d{1,2})/i);
            if (hbMatch && parseFloat(hbMatch[1].replace(',', '.')) <= 25) setVal('f45', hbMatch[1].replace(',', '.'));

            const phMatch = text.match(/(?:pH)\s*[:\-]?\s*(\d{1}[\.,]\d{2,3})/i);
            if (phMatch && parseFloat(phMatch[1].replace(',', '.')) >= 6.5) setVal('f46', phMatch[1].replace(',', '.'));

            const lacMatch = text.match(/(?:Laktat|Lactate)\s*[:\-]?\s*(\d{1,2}[\.,]\d{1,2})/i);
            if (lacMatch) setVal('f70', lacMatch[1].replace(',', '.'));

            // ===== 15. TETKİKLER =====
            if (/(?:BT\s|Tomografi|bilgisayarlı\s*tomografi)/i.test(text)) setVal('f25', '1');
            if (/(?:USG|Ultrason|ultrasonografi)/i.test(text)) setVal('f26', '1');
            if (/(?:Röntgen|Grafi|X[\-\s]?ray|direkt\s*grafi)/i.test(text)) setVal('f27', '1');
            if (/(?:Laboratuvar|Lab\b|Tetkik|kan\s*tetkik)/i.test(text)) setVal('f28', '1');

            // ===== 16. BÖLÜM & KURUM =====
            const bolumMatch = text.match(/(?:Bölüm|Birim|Klinik|Servis)\s*[:\-]?\s*([A-ZÇĞİÖŞÜa-zçğıöşü\s]{3,30})/i);
            if (bolumMatch) {
                const b = bolumMatch[1].toLowerCase();
                if (/acil/i.test(b)) setVal('f10', '1');
                else if (/yoğun\s*bakım|ybü|ybu/i.test(b)) setVal('f10', '2');
                else setVal('f10', '3');
            }

            const kurumMatch = text.match(/(?:Kurum|Hastane)\s*[:\-]?\s*([A-ZÇĞİÖŞÜa-zçğıöşü0-9\s\.\,]{3,50})/i);
            if (kurumMatch) {
                const k = kurumMatch[1].toLowerCase();
                if (/üniversite|eğitim.*araştırma|şehir\s*hastanesi/i.test(k)) setVal('f9', '3');
                else if (/devlet\s*hastanesi|ilçe/i.test(k)) setVal('f9', '2');
                else if (/aile|ASM|sağlık\s*ocağı|1\.\s*basamak/i.test(k)) setVal('f9', '1');
            }

            // ===== FINALIZE =====
            updateProgress();
            
            if(filledCount > 0) {
                showToast(`${filledCount} alan otomatik dolduruldu! Sarı alanları kontrol edin.`, 'success');
                document.querySelectorAll('.accordion-item').forEach(acc => acc.classList.add('active'));
            } else {
                showToast('Otomatik eşleşme bulunamadı. Metin yapısı tanınmadı.', 'warning');
            }
        }

        // ===== Otomatik Doldurma: Tarih -> Gün Tipi, Saat -> Mesai Durumu =====
        // Sevk Tarihi seçilince hafta içi (1) / hafta sonu (2) otomatik dolar
        function autoFillGunTipi(dateStr) {
            const f7 = document.getElementById('f7');
            if (!f7 || !dateStr) return;
            let d = null;
            // date input formatı: yyyy-mm-dd
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                d = new Date(dateStr + 'T00:00:00');
            } else if (/^\d{2}[\.\/-]\d{2}[\.\/-]\d{4}$/.test(dateStr)) {
                // gg.aa.yyyy formatı
                const parts = dateStr.split(/[\.\/-]/);
                d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}T00:00:00`);
            }
            if (!d || isNaN(d.getTime())) return;
            const day = d.getDay(); // 0=Pazar, 6=Cumartesi
            f7.value = (day === 0 || day === 6) ? 2 : 1; // Hafta sonu=2, Hafta içi=1
        }

        // Sevk Saati girilince 08:00-17:00 arası mesai (1) / dışı (2) otomatik dolar
        function autoFillMesai(timeStr) {
            const f8 = document.getElementById('f8');
            if (!f8 || !timeStr) return;
            const m = timeStr.match(/^(\d{1,2}):(\d{2})/);
            if (!m) return;
            const totalMin = parseInt(m[1]) * 60 + parseInt(m[2]);
            const start = 8 * 60;   // 08:00
            const end = 17 * 60;    // 17:00
            // 08:00-17:00 arası (17:00 dahil değil) = Mesai (1), diğer = Mesai dışı (2)
            f8.value = (totalMin >= start && totalMin < end) ? 1 : 2;
        }

        // Tarih format çevirici: yyyy-mm-dd -> gg.aa.yyyy
        function dateToDisplay(val) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(val)) {
                const p = val.split('-');
                return `${p[2]}.${p[1]}.${p[0]}`;
            }
            return val;
        }
        // Tarih format çevirici: gg.aa.yyyy -> yyyy-mm-dd (date input için)
        function displayToDate(val) {
            if (/^\d{2}[\.\/-]\d{2}[\.\/-]\d{4}$/.test(val)) {
                const p = val.split(/[\.\/-]/);
                return `${p[2]}-${p[1]}-${p[0]}`;
            }
            return val;
        }

        // Data Management
        function getFormData() {
            const data = {};
            FIELDS.forEach(f => {
                let val = document.getElementById(f.id).value;
                // Tarih alanını gg.aa.yyyy formatında kaydet
                if (f.type === 'date' && val) {
                    val = dateToDisplay(val);
                    data[f.excel] = val;
                    return;
                }
                // Save numeric value for selects/numbers, otherwise string
                if(val === '') {
                    data[f.excel] = '';
                } else {
                    if(f.type === 'number' || f.type === 'select') {
                        data[f.excel] = Number(val);
                    } else {
                        data[f.excel] = val;
                    }
                }
            });
            return data;
        }

        function saveRecord() {
            const data = getFormData();
            if(!data["TC Kimlik No"]) {
                showToast('TC Kimlik No zorunludur!', 'error');
                return;
            }

            const existingIndex = patients.findIndex(p => p["TC Kimlik No"] === data["TC Kimlik No"]);
            if(existingIndex >= 0) {
                patients[existingIndex] = data;
                showToast('Kayıt güncellendi.');
            } else {
                patients.push(data);
                showToast('Kayıt eklendi.');
            }

            localStorage.setItem('sevk_patients', JSON.stringify(patients));
            renderTable();
            clearForm();
        }

        function clearForm() {
            FIELDS.forEach(f => {
                document.getElementById(f.id).value = '';
            });
            updateProgress();
        }

        function deleteRecord(tc) {
            if(confirm('Bu kaydı silmek istediğinize emin misiniz?')) {
                patients = patients.filter(p => p["TC Kimlik No"] !== tc);
                localStorage.setItem('sevk_patients', JSON.stringify(patients));
                renderTable();
                showToast('Kayıt silindi.');
            }
        }

        function loadRecord(tc) {
            const p = patients.find(x => x["TC Kimlik No"] === tc);
            if(p) {
                FIELDS.forEach(f => {
                    if(p[f.excel] !== undefined) {
                        let v = p[f.excel];
                        // Tarih alanı için gg.aa.yyyy -> yyyy-mm-dd çevir
                        if (f.type === 'date' && v) v = displayToDate(String(v));
                        document.getElementById(f.id).value = v;
                    }
                });
                // Yüklenen kayıt için otomatik alanları da tetikle
                const f4v = document.getElementById('f4'); if (f4v && f4v.value) autoFillGunTipi(f4v.value);
                const f5v = document.getElementById('f5'); if (f5v && f5v.value) autoFillMesai(f5v.value);
                updateProgress();
                showToast('Kayıt forma yüklendi.');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('records-tbody');
            tbody.innerHTML = '';
            document.getElementById('record-count').textContent = `${patients.length} kayıt`;

            patients.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p["TC Kimlik No"] || '-'}</td>
                    <td>${p["Sevk Tarihi"] || '-'}</td>
                    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${p["Sevk tanısı ( yazıyla ) "] || ''}">${p["Sevk tanısı ( yazıyla ) "] || '-'}</td>
                    <td>${getSelectText('f10', p["Gönderen Birim"])}</td>
                    <td>${getSelectText('f16', p["Alan birim"])}</td>
                    <td>
                        <button class="btn btn-secondary" style="padding:0.2rem 0.5rem; font-size:0.75rem; display:inline-block; margin-right:0.5rem" onclick="loadRecord(${p["TC Kimlik No"]})">Düzenle</button>
                        <button class="btn btn-warning" style="padding:0.2rem 0.5rem; font-size:0.75rem; display:inline-block" onclick="deleteRecord(${p["TC Kimlik No"]})">Sil</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getSelectText(fieldId, value) {
            if(value === undefined || value === '') return '-';
            const field = FIELDS.find(f => f.id === fieldId);
            if(field && field.opts) {
                const opt = field.opts.find(o => o.v === value);
                if(opt) return opt.t;
            }
            return value;

        // ============================================================

        // Yükleme panelini oluştur (phase: 'pre' | 'post')
        function buildVisionPanel(phase) {
            const title = phase === 'pre'
                ? 'Sevk Öncesi Belge / Fotoğraf Yükle'
                : 'Sevk Sonrası Belge / Fotoğraf Yükle';

            const panel = document.createElement('div');
            panel.className = 'vision-panel';
            panel.innerHTML = `
                <div class="vision-panel-header">📷 ${title}</div>
                <div class="vision-panel-body">
                    <div class="vision-actions vision-actions-top">
                        <button type="button" class="btn btn-vision" id="vision-btn-${phase}" onclick="readVisionData('${phase}')">
                            🔍 Fotoğraftan Verileri Oku
                        </button>
                        <span class="vision-status" id="vision-status-${phase}"></span>
                    </div>
                    <div class="vision-drop" id="vision-drop-${phase}">
                        <span class="vision-drop-icon">🖼️</span>
                        Fotoğraf / PDF sürükleyin ya da seçmek için tıklayın
                        <div style="font-size:0.72rem;margin-top:0.3rem;">JPG, PNG, PDF • birden fazla dosya seçilebilir</div>
                    </div>

            // Sürükle-bırak ve dosya seçme olaylarını bağla (node'lar panel içinde mevcut)

            drop.addEventListener('click', () => input.click());
            ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => {
                e.preventDefault(); drop.classList.add('dragover');
            }));
            ['dragleave','dragend'].forEach(ev => drop.addEventListener(ev, e => {
                e.preventDefault(); drop.classList.remove('dragover');
            }));
            drop.addEventListener('drop', e => {
                e.preventDefault(); drop.classList.remove('dragover');
                handleVisionFiles(phase, e.dataTransfer.files);
            });
            input.addEventListener('change', e => handleVisionFiles(phase, e.target.files));

            return panel;
        }

        function handleVisionFiles(phase, fileList) {
            const files = Array.from(fileList || []);
            files.forEach(f => {
                const okType = f.type.startsWith('image/') || f.type === 'application/pdf'
                    || /\.(jpe?g|png|pdf)$/i.test(f.name);
                if (!okType) {
                    showToast('"' + f.name + '" desteklenmeyen bir format.', 'warning');
                    return;
                }
                visionFiles[phase].push(f);
            });
            renderVisionThumbs(phase);
            // input'u sıfırla ki aynı dosya tekrar seçilebilsin
            const input = document.getElementById('vision-input-' + phase);
            if (input) input.value = '';
        }

        function renderVisionThumbs(phase) {
            const wrap = document.getElementById('vision-thumbs-' + phase);
            if (!wrap) return;
            wrap.innerHTML = '';
            visionFiles[phase].forEach((f, idx) => {
                const thumb = document.createElement('div');
                thumb.className = 'vision-thumb';
                if (f.type.startsWith('image/')) {
                    const url = URL.createObjectURL(f);
                    thumb.innerHTML = `<img src="${url}" alt=""><button class="thumb-remove" title="Kaldır">×</button>`;
                } else {
                    const shortName = f.name.length > 20 ? f.name.slice(0, 18) + '…' : f.name;
                    thumb.innerHTML = `<div><div class="pdf-badge">📄</div><div style="word-break:break-all;">${shortName}</div></div><button class="thumb-remove" title="Kaldır">×</button>`;
                }
                thumb.querySelector('.thumb-remove').addEventListener('click', () => {
                    visionFiles[phase].splice(idx, 1);
                    renderVisionThumbs(phase);
                });
                wrap.appendChild(thumb);
            });
        }

        // Dosyayı görsel data-URL dizisine çevir (resim: 1 adet; PDF: sayfa başına PNG, en fazla 5 sayfa)
        async function fileToImageDataURLs(file) {
            if (file.type.startsWith('image/')) {
                const url = await new Promise((res, rej) => {
                    const r = new FileReader();
                    r.onload = () => res(r.result);
                    r.onerror = rej;
                    r.readAsDataURL(file);
                });
                return [url];
            }
            // PDF → pdf.js ile sayfaları PNG'ye render et
            if (window.pdfjsLib) {
                const buf = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
                const urls = [];
                const maxPages = Math.min(pdf.numPages, 5);
                for (let i = 1; i <= maxPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    urls.push(canvas.toDataURL('image/png'));
                }
                return urls;
            }
            return [];
        }

        function parseVisionJson(raw) {
            if (!raw) return null;
            let s = String(raw).trim();
            s = s.replace(/```json/gi, '').replace(/```/g, '').trim();
            const start = s.indexOf('{');
            const end = s.lastIndexOf('}');
            if (start !== -1 && end !== -1) s = s.slice(start, end + 1);
            try { return JSON.parse(s); } catch (e) { return null; }
        }

        function setSelectField(fid, value) {
            const el = document.getElementById(fid);
            if (!el) return 0;
            el.value = String(value);
            if (el.value !== String(value)) return 0; // eşleşen seçenek yok
            el.classList.add('auto-filled');
            setTimeout(() => el.classList.remove('auto-filled'), 5000);
            return 1;
        }

        function applyVisionData(phase, data) {
            const map = VISION_FIELD_MAP[phase];
            let filled = 0;

            // TC Kimlik No (11 haneli sayı)
            if (map.tc_kimlik_no && data.tc_kimlik_no != null && String(data.tc_kimlik_no).trim() !== '') {
                const el = document.getElementById(map.tc_kimlik_no);
                if (el && (!el.value || el.value.trim() === '')) {
                    const tc = String(data.tc_kimlik_no).trim().replace(/\D/g, ''); // sadece rakamlar
                    if (tc.length === 11) {
                        el.value = tc;
                        el.classList.add('auto-filled');
                        setTimeout(() => el.classList.remove('auto-filled'), 5000);
                        filled++;
                    }
                }
            }

            // Yaş (sayısal)
            if (map.yas && data.yas != null && String(data.yas).trim() !== '') {
                const el = document.getElementById(map.yas);
                if (el && (!el.value || el.value.trim() === '')) {
                    el.value = String(data.yas).trim();
                    el.classList.add('auto-filled');
                    setTimeout(() => el.classList.remove('auto-filled'), 5000);
                    filled++;
                }
            }

            // Cinsiyet (select: 1=Erkek, 2=Kadın)
            if (map.cinsiyet && data.cinsiyet != null) {
                const t = String(data.cinsiyet).trim().toUpperCase();
                let v = null;
                if (t === 'ERKEK' || t === 'E') v = 1;
                else if (t === 'KADIN' || t === 'K') v = 2;
                if (v !== null) filled += setSelectField(map.cinsiyet, v);
            }

            // Sevk Tarihi (date alanı) - gg.aa.yyyy -> yyyy-mm-dd
            if (map.sevk_tarihi && data.sevk_tarihi != null && String(data.sevk_tarihi).trim() !== '') {
                const el = document.getElementById(map.sevk_tarihi);
                if (el && (!el.value || el.value.trim() === '')) {
                    el.value = displayToDate(String(data.sevk_tarihi).trim().replace(/[\/-]/g, '.'));
                    el.classList.add('auto-filled');
                    setTimeout(() => el.classList.remove('auto-filled'), 5000);
                    autoFillGunTipi(el.value);
                    filled++;
                }
            }

            // Sevk Saati / Kabul Saati (time alanları) - hh:mm
            [['sevk_saati','f5'],['kabul_saati','f6']].forEach(([key]) => {
                if (map[key] && data[key] != null && String(data[key]).trim() !== '') {
                    const el = document.getElementById(map[key]);
                    if (el && (!el.value || el.value.trim() === '')) {
                        const tm = String(data[key]).trim().replace('.', ':').match(/(\d{1,2}):(\d{2})/);
                        if (tm) {
                            el.value = tm[1].padStart(2,'0') + ':' + tm[2];
                            el.classList.add('auto-filled');
                            setTimeout(() => el.classList.remove('auto-filled'), 5000);
                            if (map[key] === 'f5') autoFillMesai(el.value);
                            filled++;
                        }
                    }
                }
            });

            // Sayısal / metin alanları
            ['sistolik','diastolik','map','spo2','nabiz','solunum','ates','gks','hemoglobin','ph','laktat'].forEach(k => {
                if (map[k] && data[k] !== undefined && data[k] !== null && String(data[k]).trim() !== '') {
                    const el = document.getElementById(map[k]);
                    if (el) {
                        el.value = String(data[k]).trim();
                        el.classList.add('auto-filled');
                        setTimeout(() => el.classList.remove('auto-filled'), 5000);
                        filled++;
                    }
                }
            });

            // AVPU (bilinç durumu) select eşlemesi
            if (map.avpu && data.avpu != null) {
                const m = { alert:1, verbal:2, pain:3, unresponsive:4, a:1, v:2, p:3, u:4 };
                const v = m[String(data.avpu).trim().toLowerCase()];
                if (v) filled += setSelectField(map.avpu, v);
            }

            // Ventilasyon select eşlemesi
            if (map.ventilasyon && data.ventilasyon != null) {
                const t = String(data.ventilasyon).trim().toLowerCase();
                let v = null;
                if (t.includes('spontan')) v = 0;
                else if (t.includes('nimv')) v = 2;
                else if (t.includes('mekanik') || t.includes('ventilat') || t === 'mv') v = 3;
                else if (t.includes('o2') || t.includes('nazal') || t.includes('maske') || t.includes('oksijen')) v = 1;
                if (v !== null) filled += setSelectField(map.ventilasyon, v);
            }

            // Vazopressör desteği (yalnızca sevk öncesi) select eşlemesi
            if (map.vazopressor && data.vazopressor != null) {
                const t = String(data.vazopressor).trim().toLowerCase();
                let v = null;
                if (t.includes('var') || t === '1' || t === 'true' || t.includes('evet')) v = 1;
                else if (t.includes('yok') || t === '0' || t === 'false' || t.includes('hayır')) v = 0;
                if (v !== null) filled += setSelectField(map.vazopressor, v);
            }

            updateProgress();
            return filled;
        }

        async function readVisionData(phase) {
            const files = visionFiles[phase];
            const btn = document.getElementById('vision-btn-' + phase);
            const status = document.getElementById('vision-status-' + phase);

            if (!files.length) {
                showToast('Önce en az bir belge/fotoğraf yükleyin.', 'warning');
                return;
            }
            const apiKey = getApiKey();
            if (!apiKey) {
                showToast('Lütfen önce Abacus.AI API anahtarınızı girin.', 'warning');
                const inp = document.getElementById('vision-apikey-' + phase);
                if (inp) inp.focus();
                return;
            }

            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="vision-spinner"></span> Okunuyor...';
            status.textContent = 'Görseller analiz ediliyor, lütfen bekleyin...';

            try {
                // Tüm dosyaları görsel data-URL'lerine çevir
                let images = [];
                for (const f of files) {
                    const urls = await fileToImageDataURLs(f);
                    images = images.concat(urls);
                }
                if (!images.length) throw new Error('Görsel hazırlanamadı');

                const phaseLabel = phase === 'pre' ? 'sevk öncesi' : 'hedef hastaneye kabul sırasındaki';
                const schemaKeys = phase === 'pre'
                    ? 'tc_kimlik_no, yas, cinsiyet, sevk_tarihi, sevk_saati, sistolik, diastolik, map, spo2, nabiz, solunum, ates, gks, avpu, ventilasyon, hemoglobin, ph, vazopressor'
                    : 'tc_kimlik_no, yas, cinsiyet, kabul_saati, sistolik, diastolik, map, spo2, nabiz, solunum, ates, gks, avpu, ventilasyon, hemoglobin, ph, laktat';

                const promptText =
`Sen bir tıbbi veri çıkarma asistanısın. Ekteki görsel(ler) bir hastanın ${phaseLabel} tıbbi belge/monitör/tetkik fotoğraflarıdır.
Görsellerdeki demografik bilgileri, vital bulguları ve laboratuvar değerlerini oku ve SADECE geçerli bir JSON nesnesi döndür (başka hiçbir açıklama yazma).
JSON anahtarları: ${schemaKeys}
Kurallar:
- tc_kimlik_no: 11 haneli TC Kimlik Numarası (yalnızca rakamlar, boşluksuz)
- yas: hastanın yaşı (yalnızca sayı)
- cinsiyet: "Erkek" | "Kadın" | "E" | "K"
${phase === 'pre' ? '- sevk_tarihi: sevk/başvuru/transfer tarihi "gg.aa.yyyy" formatında (doğum tarihini ALMA)\n- sevk_saati: sevk/başvuru saati "SS:DD" (24 saat) formatında' : '- kabul_saati: hedef hastaneye kabul/teslim saati "SS:DD" (24 saat) formatında'}
- sistolik/diastolik: kan basıncı mmHg (ör. "130/85" -> sistolik 130, diastolik 85)
- map: ortalama arteriyel basınç (yalnızca görselde açıkça varsa)
- spo2: oksijen satürasyonu (yalnızca sayı, % işareti olmadan)
- nabiz: kalp hızı /dk
- solunum: solunum sayısı /dk
- ates: vücut ısısı °C
- gks: Glasgow koma skoru (3-15)
- avpu: "Alert" | "Verbal" | "Pain" | "Unresponsive"
- ventilasyon: "Spontan" | "O2" | "NIMV" | "MV"
- hemoglobin: g/dL
- ph: kan gazı pH
${phase === 'pre' ? '- vazopressor: "Var" | "Yok"' : '- laktat: mmol/L'}
Bir değer görselde yoksa o anahtarı null yap. Sayısal değerleri yalnızca sayı olarak ver (birim ekleme).`;

                const content = [{ type: 'text', text: promptText }];
                images.forEach(url => content.push({ type: 'image_url', image_url: { url } }));

                const resp = await fetch(VISION_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: VISION_MODEL,
                        messages: [{ role: 'user', content }],
                        temperature: 0
                    })
                });

                if (!resp.ok) {
                    if (resp.status === 401 || resp.status === 403) {
                        throw new Error('API anahtarı geçersiz veya yetkisiz (' + resp.status + ')');
                    }
                    throw new Error('API hatası (' + resp.status + ')');
                }

                const data = await resp.json();
                const rawContent = data && data.choices && data.choices[0] && data.choices[0].message
                    ? data.choices[0].message.content : '';
                const parsed = parseVisionJson(rawContent);
                if (!parsed) throw new Error('Yanıt çözümlenemedi');

                const filled = applyVisionData(phase, parsed);
                if (filled > 0) {
                    showToast(filled + ' alan fotoğraftan otomatik dolduruldu.', 'success');
                    status.textContent = '✓ ' + filled + ' alan dolduruldu.';
                } else {
                    showToast('Görselde okunabilir vital bulgu bulunamadı.', 'warning');
                    status.textContent = 'Okunabilir veri bulunamadı.';
                }
            } catch (err) {
                console.error('Vision OCR hatası:', err);
                showToast('Veriler okunamadı, lütfen manuel girin.', 'error');
                status.textContent = 'Hata: ' + (err.message || 'okunamadı');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', initForm);
    </script>
